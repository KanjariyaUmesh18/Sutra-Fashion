<aside class="admin-sidebar">
  <div class="admin-sidebar__logo">
    S<span>Ū</span>TRA <small>Admin</small>
  </div>
  <nav class="admin-sidebar__nav">
    <div class="admin-sidebar__section-title">Overview</div>
    <a href="{% url 'admin_dashboard' %}" class="admin-nav-link {% if active == 'dashboard' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="14" y="14" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /></svg>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="{% url 'admin_order_list' %}" class="admin-nav-link {% if active == 'orders' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" /></svg>
      <span class="nav-label">Orders</span>
      {% if pending_orders_count %}
        <span class="nav-count">{{ pending_orders_count }}</span>
      {% endif %}
    </a>
    <a href="{% url 'admin_contact_list' %}" class="admin-nav-link {% if active == 'messages' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
      <span class="nav-label">Messages</span>
      {% if unread_messages_count %}
        <span class="nav-count">{{ unread_messages_count }}</span>
      {% endif %}
    </a>

    <div class="admin-sidebar__section-title">Catalog</div>
    <a href="{% url 'admin_product_list' %}" class="admin-nav-link {% if active == 'products' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" /><line x1="7" y1="7" x2="7.01" y2="7" /></svg>
      <span class="nav-label">Products</span>
    </a>
    <a href="{% url 'admin_category_list' %}" class="admin-nav-link {% if active == 'categories' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" /></svg>
      <span class="nav-label">Categories</span>
    </a>

    <div class="admin-sidebar__section-title">System</div>
    <a href="{% url 'admin_profile' %}" class="admin-nav-link {% if active == 'profile' %}is-active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
      <span class="nav-label">My Profile</span>
    </a>
    <a href="{% url 'admin_logout' %}" class="admin-nav-link">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
      <span class="nav-label">Logout</span>
    </a>
  </nav>
</aside>
