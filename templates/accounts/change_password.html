{% extends 'base.html' %}
{% load static %}

{% block title %}Change Password — SUTRA{% endblock %}

{% block content %}
<header class="page-header text-center">
  <div class="container">
    <h1>Change Password</h1>
  </div>
</header>

<main class="section" style="padding-top:0">
  <div class="container">
    <div class="account-layout">
      <!-- Sidebar -->
      <aside class="account-sidebar">
        <nav class="account-nav">
          <a href="{% url 'profile' %}">Profile Overview</a>
          <a href="{% url 'order_history' %}">Order History</a>
          <a href="{% url 'address_list' %}">Saved Addresses</a>
          <a href="{% url 'edit_profile' %}" class="is-active">Account Settings</a>
        </nav>
      </aside>

      <!-- Content -->
      <div class="account-content">
        <div class="account-card" style="max-width:500px">
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="margin-top:var(--space-md)">Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
