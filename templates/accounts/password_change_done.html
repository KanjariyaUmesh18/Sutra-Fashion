{% extends 'base.html' %}
{% block title %}Password Changed — SUTRA{% endblock %}
{% block content %}
<main class="section text-center" style="min-height:60vh;display:flex;align-items:center;justify-content:center">
  <div class="container" style="max-width:500px">
    <svg viewBox="0 0 24 24" style="width:64px;height:64px;margin-bottom:var(--space-md);stroke:var(--color-sage);fill:none;stroke-width:1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
    <h1 style="font-size:var(--fs-display-sm);margin-bottom:var(--space-sm)">Password Changed</h1>
    <p class="text-muted" style="margin-bottom:var(--space-lg)">Your password has been updated successfully.</p>
    <a href="{% url 'profile' %}" class="btn">Back to Profile</a>
  </div>
</main>
{% endblock %}
