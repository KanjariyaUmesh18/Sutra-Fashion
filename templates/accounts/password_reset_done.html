{% extends 'base.html' %}
{% block title %}Check Your Email — SUTRA{% endblock %}
{% block content %}
<main class="section auth-section">
  <div class="container" style="max-width:400px">
    <div class="auth-card text-center">
      <h1 style="font-size:var(--fs-display-sm);margin-bottom:var(--space-sm)">Check Your Email</h1>
      <p class="text-muted" style="margin-bottom:var(--space-lg)">We've sent password reset instructions to your email address.</p>
      <a href="{% url 'login' %}" class="btn">Back to Login</a>
    </div>
  </div>
</main>
{% endblock %}
