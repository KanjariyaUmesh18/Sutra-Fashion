{% extends 'base.html' %}
{% block title %}Reset Password — SUTRA{% endblock %}
{% block content %}
<main class="section auth-section">
  <div class="container" style="max-width:400px">
    <div class="auth-card">
      <div class="text-center" style="margin-bottom:var(--space-lg)">
        <h1 style="font-size:var(--fs-display-sm)">Reset Password</h1>
        <p class="text-muted">Enter your email and we'll send you a reset link.</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="id_email">Email Address</label>
          <input type="email" name="email" class="form-control" id="id_email" required>
        </div>
        <button type="submit" class="btn btn--block">Send Reset Link</button>
      </form>
      <div class="text-center text-sm text-muted" style="margin-top:var(--space-lg)">
        <a href="{% url 'login' %}" style="color:var(--color-oxblood)">← Back to Login</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
