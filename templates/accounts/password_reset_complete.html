{% extends 'base.html' %}
{% block title %}Password Reset Complete — SUTRA{% endblock %}
{% block content %}
<main class="section text-center" style="min-height:60vh;display:flex;align-items:center;justify-content:center">
  <div class="container" style="max-width:500px">
    <h1 style="font-size:var(--fs-display-sm);margin-bottom:var(--space-sm)">Password Reset Complete</h1>
    <p class="text-muted" style="margin-bottom:var(--space-lg)">Your password has been set. You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="btn">Sign In</a>
  </div>
</main>
{% endblock %}
