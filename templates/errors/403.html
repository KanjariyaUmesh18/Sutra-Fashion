{% extends 'base.html' %}

{% block title %}Access Denied — SUTRA{% endblock %}

{% block content %}
<main class="section text-center" style="min-height:60vh; display:flex; align-items:center; justify-content:center">
  <div class="container">
    <h1 style="font-size:120px; color:var(--color-sand); line-height:1; margin-bottom:var(--space-md)">403</h1>
    <h2 style="font-size:var(--fs-xl); margin-bottom:var(--space-sm)">Access Denied</h2>
    <p class="text-muted" style="margin-bottom:var(--space-lg); max-width:400px; margin-inline:auto">
      You don't have permission to view this page. If you believe this is a mistake, make sure you're logged in with an account that has admin access.
    </p>
    <a href="{% url 'home' %}" class="btn">Return to Homepage</a>
  </div>
</main>
{% endblock %}
