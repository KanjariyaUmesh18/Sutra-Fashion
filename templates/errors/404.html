{% extends 'base.html' %}

{% block title %}Page Not Found — SUTRA{% endblock %}

{% block content %}
<main class="section text-center" style="min-height:60vh; display:flex; align-items:center; justify-content:center">
  <div class="container">
    <h1 style="font-size:120px; color:var(--color-sand); line-height:1; margin-bottom:var(--space-md)">404</h1>
    <h2 style="font-size:var(--fs-xl); margin-bottom:var(--space-sm)">Page Not Found</h2>
    <p class="text-muted" style="margin-bottom:var(--space-lg); max-width:400px; margin-inline:auto">
      We couldn't find the page you were looking for. It might have been removed, renamed, or did not exist in the first place.
    </p>
    <a href="{% url 'home' %}" class="btn">Return to Homepage</a>
  </div>
</main>
{% endblock %}
